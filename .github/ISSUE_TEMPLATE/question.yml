name: Question
description: Ask a how-to or clarification question about myharness
title: "[question] "
labels: ["question", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Questions are welcome. This is a single-maintainer fork, so replies are best-effort with no guaranteed turnaround.

        If your question is about the meta-skill itself rather than this fork, [the upstream project](https://github.com/revfactory/harness) may be a better venue.

  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What would you like to know?
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: What have you tried?
      description: Commands run, docs read, related issues you've already found.
    validations:
      required: false

  - type: textarea
    id: docs
    attributes:
      label: Related docs / links (optional)
      description: Paste links to sections of the README, docs, or issues you've already read.
    validations:
      required: false
